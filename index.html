<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>НМТ Події — Історія України</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --card: #1a1a2e;
      --card-hover: #22223a;
      --border: #2e2e4a;
      --text: #e8e6f0;
      --muted: #9b97b0;
      --accent: #ff6b6b;
      --accent2: #4ecdc4;
      --accent3: #ffe66d;
      --purple: #a78bfa;
      --green: #2dd4a8;
      --red: #ff6b6b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      background-image: 
        radial-gradient(ellipse at 20% 20%, #1a1035 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, #0d1f2d 0%, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    .container { width: 100%; max-width: 640px; }

    /* ===== HEADER ===== */
    .logo {
      text-align: center;
      margin-bottom: 8px;
    }
    .logo h1 {
      font-size: 2.1rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ff6b6b, #a78bfa, #4ecdc4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 28px;
    }

    /* ===== SCREENS ===== */
    .screen { display: none; animation: fadeIn 0.3s ease; }
    .screen.active { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== MODE BUTTONS ===== */
    .mode-btn {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 20px;
      margin-bottom: 12px;
      cursor: pointer;
      color: var(--text);
      text-align: left;
      display: flex;
      gap: 16px;
      align-items: center;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    .mode-btn::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: transparent;
      transition: 0.25s;
    }
    .mode-btn:hover {
      background: var(--card-hover);
      border-color: #3d3d5c;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .mode-btn:hover::before { background: var(--accent); }
    .mode-btn .icon {
      font-size: 1.7rem;
      width: 48px;
      height: 48px;
      background: #252540;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .mode-btn h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 3px; }
    .mode-btn p { font-size: 0.85rem; color: var(--muted); }

    /* special buttons */
    #btn-achievements { border-color: #5b4a8a55; }
    #btn-achievements:hover::before { background: var(--purple); }
    #btn-chrono:hover::before { background: var(--accent2); }
    #btn-person-fact:hover::before, #btn-fact-person:hover::before { background: var(--accent3); }

    /* ===== QUIZ ===== */
    .back-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.95rem;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }
    .back-btn:hover { color: var(--text); }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .progress-info { color: var(--muted); font-size: 0.9rem; }
    .score-box {
      background: linear-gradient(135deg, #2a2a4a, #1e1e35);
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.95rem;
      border: 1px solid var(--border);
    }

    .progress-bar {
      height: 8px;
      background: #252540;
      border-radius: 10px;
      margin-bottom: 24px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff6b6b, #a78bfa, #4ecdc4);
      border-radius: 10px;
      width: 0%;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .question-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 26px 22px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .question-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent2);
      margin-bottom: 12px;
      font-weight: 600;
    }
    .question-text {
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.5;
    }

    .option {
      width: 100%;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 10px;
      cursor: pointer;
      color: var(--text);
      font-size: 1rem;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.2s;
    }
    .option:hover:not(.disabled) {
      border-color: #5b5b8a;
      background: var(--card-hover);
      transform: translateX(4px);
    }
    .option .letter {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: #2a2a48;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    .option.correct {
      border-color: var(--green);
      background: rgba(45, 212, 168, 0.12);
    }
    .option.correct .letter { background: var(--green); color: #0f0f1a; }
    .option.wrong {
      border-color: var(--red);
      background: rgba(255, 107, 107, 0.12);
    }
    .option.wrong .letter { background: var(--red); color: #fff; }
    .option.disabled { cursor: default; }
    .option.chosen {
      border-color: var(--purple);
      background: rgba(167, 139, 250, 0.12);
    }
    .option.chosen .letter { background: var(--purple); color: #fff; }
    .option .ch-date {
      color: var(--muted);
      font-size: 0.85rem;
      margin-left: auto;
      white-space: nowrap;
    }

    .chrono-reset {
      margin-top: 8px;
      width: 100%;
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--muted);
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: 0.2s;
    }
    .chrono-reset:hover { border-color: var(--muted); color: var(--text); }

    /* ===== RESULT ===== */
    .result-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.3);
    }
    .result-emoji { font-size: 3.5rem; margin-bottom: 12px; }
    .result-card h2 { font-size: 1.6rem; margin-bottom: 6px; }
    .result-score {
      font-size: 2.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ff6b6b, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 16px 0;
    }
    .result-details { color: var(--muted); margin-bottom: 28px; font-size: 1.05rem; }

    .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      padding: 14px 28px;
      border-radius: 14px;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
      color: white;
      box-shadow: 0 4px 16px rgba(255, 107, 107, 0.3);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4); }
    .btn-secondary {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover { background: var(--card-hover); }

    /* ===== ACHIEVEMENTS ===== */
    .ach-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }
    .ach-header h2 { font-size: 1.5rem; font-weight: 800; }
    .ach-count { color: var(--muted); font-size: 0.95rem; }
    .ach-count span { color: var(--accent2); font-weight: 700; }

    .ach-list { display: flex; flex-direction: column; gap: 12px; }
    .ach-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      transition: 0.25s;
    }
    .ach-card.unlocked {
      border-color: rgba(45, 212, 168, 0.35);
      background: linear-gradient(135deg, #1a1a2e, #132a24);
      box-shadow: 0 0 20px rgba(45, 212, 168, 0.08);
    }
    .ach-icon {
      font-size: 1.7rem;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #252540;
      border-radius: 14px;
      flex-shrink: 0;
    }
    .ach-card.unlocked .ach-icon {
      background: linear-gradient(135deg, #1a4a3a, #0f2e24);
    }
    .ach-info { flex: 1; min-width: 0; }
    .ach-title {
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .ach-card:not(.unlocked) .ach-title { color: var(--muted); }
    .ach-desc { font-size: 0.85rem; color: var(--muted); line-height: 1.4; }
    .ach-badge {
      font-size: 0.7rem;
      background: var(--green);
      color: #0f0f1a;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 700;
    }
    .ach-progress {
      margin-top: 10px;
      height: 6px;
      background: #252540;
      border-radius: 6px;
      overflow: hidden;
    }
    .ach-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff6b6b, #a78bfa);
      border-radius: 6px;
      transition: width 0.5s;
    }
    .ach-progress-text {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 5px;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      color: #5a5780;
      font-size: 0.8rem;
    }

    /* sponsor */
    .sponsor {
      text-align: center;
      margin: 32px 0 10px;
    }
    .sponsor img {
      max-width: 100%;
      width: 380px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    /* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: 28px;
  right: 28px;
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border: 1px solid #3d3d5c;
  border-radius: 16px;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(167, 139, 250, 0.15);
  z-index: 9999;
  transform: translateY(120px);
  opacity: 0;
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  max-width: 340px;
  pointer-events: none;
}
.toast.show {
  transform: translateY(0);
  opacity: 1;
}
.toast-icon {
  font-size: 2rem;
  width: 48px;
  height: 48px;
  background: linear-gradient(135deg, #2a2a4a, #1e1e35);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.toast-info {
  flex: 1;
  min-width: 0;
}
.toast-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #2dd4a8;
  font-weight: 700;
  margin-bottom: 2px;
}
.toast-title {
  font-weight: 700;
  font-size: 1.05rem;
  color: #e8e6f0;
}
.toast-desc {
  font-size: 0.8rem;
  color: #9b97b0;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
  </style>
</head>
<body>
  <div class="container">
    <!-- MENU -->
    <div id="screen-menu" class="screen active">
      <div class="logo"><h1>НМТ Події</h1></div>
      <p class="subtitle">Тренувальний тест з історії України</p>

      <button class="mode-btn" id="btn-event-date">
        <div class="icon">📅</div>
        <div>
          <h2>Подія → Дата</h2>
          <p>Дано подію — обирай правильну дату</p>
        </div>
      </button>
      <button class="mode-btn" id="btn-date-event">
        <div class="icon">📜</div>
        <div>
          <h2>Дата → Подія</h2>
          <p>Дано дату — обирай, що тоді сталося</p>
        </div>
      </button>
      <button class="mode-btn" id="btn-century20">
        <div class="icon">🕰️</div>
        <div>
          <h2>Тільки XX століття</h2>
          <p>Питання лише з 1900–1999 років</p>
        </div>
      </button>
      <button class="mode-btn" id="btn-person-fact">
        <div class="icon">👤</div>
        <div>
          <h2>Персоналія → Факт</h2>
          <p>Дано ім’я — обирай правильний факт</p>
        </div>
      </button>
      <button class="mode-btn" id="btn-fact-person">
        <div class="icon">📝</div>
        <div>
          <h2>Факт → Персоналія</h2>
          <p>Дано факт — обирай, кому він належить</p>
        </div>
      </button>
      <button class="mode-btn" id="btn-chrono">
        <div class="icon">⏳</div>
        <div>
          <h2>Хронологія</h2>
          <p>Розстав 4 події в правильній послідовності</p>
        </div>
      </button>
      <button class="mode-btn" id="btn-achievements">
        <div class="icon">🏆</div>
        <div>
          <h2>Досягнення</h2>
          <p>Переглянути всі ачівки та прогрес</p>
        </div>
      </button>

      <div class="sponsor">
        <img src="madeby.jpg" alt="Sponsored by">
      </div>
    </div>

    <!-- QUIZ -->
    <div id="screen-quiz" class="screen">
      <button class="back-btn" id="btn-back">← Назад до меню</button>
      <div class="quiz-header">
        <div class="progress-info" id="progress-info">Питання 1 з 15</div>
        <div class="score-box" id="score-box">✓ 0</div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="question-card">
        <div class="question-label" id="question-label">Яка дата цієї події?</div>
        <div class="question-text" id="question-text"></div>
      </div>
      <div id="options"></div>
    </div>

    <!-- RESULT -->
    <div id="screen-result" class="screen">
      <div class="result-card">
        <div class="result-emoji" id="result-emoji">🏆</div>
        <h2 id="result-title">Відмінно!</h2>
        <div class="result-score" id="result-score">12 / 15</div>
        <div class="result-details" id="result-details">Ти правильно відповів на 80% питань</div>
        <div class="btn-row">
          <button class="btn btn-primary" id="btn-restart">Ще раз</button>
          <button class="btn btn-secondary" id="btn-menu">До меню</button>
        </div>
      </div>
    </div>

    <!-- ACHIEVEMENTS -->
    <div id="screen-achievements" class="screen">
      <button class="back-btn" id="btn-back-ach">← Назад до меню</button>
      <div class="ach-header">
        <h2>Досягнення</h2>
        <div class="ach-count">Отримано: <span id="ach-unlocked-count">0</span> / <span id="ach-total-count">12</span></div>
      </div>
      <div class="ach-list" id="ach-list"></div>
    </div>
  </div>
  <footer>НМТ з історії України · Підготовка до тесту</footer>

  <div class="toast" id="toast">
  <div class="toast-icon" id="toast-icon">🏆</div>
  <div class="toast-info">
    <div class="toast-label">Нове досягнення!</div>
    <div class="toast-title" id="toast-title">Назва</div>
    <div class="toast-desc" id="toast-desc">Опис</div>
  </div>
</div>

  <script>
    const events = [
      { date: "860 р.", event: "Похід Аскольда на Константинополь, укладення першого відомого договору Русі з Візантією", year: 860 },

      { date: "1223 р.", event: "Битва на р. Калка", year: 1223 },

      { date: "1586 р.", event: "Утворення першої братської школи у м. Львів", year: 1586 },
      { date: "1596 р.", event: "Берестейська церковна унія. Утворення греко-католицької церкви", year: 1596 },
      { date: "1618 р.", event: "Похід козаків під проводом гетьмана П. Конашевича-Сагайдачного на Москву", year: 1618 },
      { date: "1621 р.", event: "Хотинська битва", year: 1621 },
      { date: "1625 р.", event: "Куруківська угода", year: 1625 },
      { date: "1632 р.", event: "«Пункти для заспокоєння руського народу», утворення Києво-Могилянської колегії", year: 1632 },
      { date: "1637–1638 рр.", event: "Повстання під проводом Павла Павлюка, Якова Острянина, Дмитра Гуні", year: 1637 },

    function defaultProgress() {
      return {
        quizzesPlayed: 0, perfect15: false, almost15: false,
        correctKnyaz: 0, correctCossack: 0, correctXX: 0,
        uniqueCorrect: [], chernobyl: false, unlocked: {},
      correctPersonality: 0,
    uniquePersonalities: [],
    correctWriters: 0,
    correctHetmans: 0
  };
}

    function loadProgress() {
      try {
        const raw = localStorage.getItem('nmt_achievements');
        return raw ? { ...defaultProgress(), ...JSON.parse(raw) } : defaultProgress();
      } catch { return defaultProgress(); }
    }

    function saveProgress(p) {
      localStorage.setItem('nmt_achievements', JSON.stringify(p));
    }

    let progress = loadProgress();

    function isKnyaz(e) { return e.year <= 1240; }
    function isXX(e) { return e.year >= 1900 && e.year <= 1991; }
    function isCossack(e) { return COSSACK_EVENTS.has(e.event); }
    function isChernobyl(e) { return e.date.includes('26 квітня 1986'); }

    function registerCorrect(item) {
      if (!progress.uniqueCorrect.includes(item.event)) {
        progress.uniqueCorrect.push(item.event);
      }
      if (isKnyaz(item)) progress.correctKnyaz++;
      if (isCossack(item)) progress.correctCossack++;
      if (isXX(item)) progress.correctXX++;
      if (isChernobyl(item)) progress.chernobyl = true;
      checkAchievements();
      saveProgress(progress);
    }

    function registerPersonalityCorrect(person) {
  if (!progress.correctPersonality) progress.correctPersonality = 0;
  if (!progress.uniquePersonalities) progress.uniquePersonalities = [];
  if (!progress.correctWriters) progress.correctWriters = 0;
  if (!progress.correctHetmans) progress.correctHetmans = 0;

  progress.correctPersonality++;

  if (!progress.uniquePersonalities.includes(person.name)) {
    progress.uniquePersonalities.push(person.name);
  }
  if (WRITERS.has(person.name)) progress.correctWriters++;
  if (HETMANS.has(person.name)) progress.correctHetmans++;

  checkAchievements();
  saveProgress(progress);
}

function showToast(achievement) {
  const toast = document.getElementById('toast');
  document.getElementById('toast-icon').textContent = achievement.icon;
  document.getElementById('toast-title').textContent = achievement.title;
  document.getElementById('toast-desc').textContent = achievement.desc;
  
  toast.classList.add('show');
  
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 3500);
}

function checkAchievements() {
  const u = progress.unlocked;
  const newlyUnlocked = [];

  const checks = [
    { id: 'first_step',    condition: progress.quizzesPlayed >= 1 },
    { id: 'perfect',       condition: progress.perfect15 },
    { id: 'almost',        condition: progress.almost15 },
    { id: 'knyaz',         condition: progress.correctKnyaz >= 10 },
    { id: 'cossack',       condition: progress.correctCossack >= 15 },
    { id: 'witness_xx',    condition: progress.correctXX >= 20 },
    { id: 'stalker',       condition: progress.chernobyl },
    { id: 'historian',     condition: progress.uniqueCorrect.length >= 50 },
    { id: 'yavornytsky',   condition: progress.uniqueCorrect.length >= 100 },
    { id: 'hrushevsky',    condition: progress.uniqueCorrect.length >= Math.ceil(events.length * 0.9) },
    { id: 'revolutionary', condition: REVOLUTIONARY_EVENTS.size > 0 &&
        [...REVOLUTIONARY_EVENTS].every(ev => progress.uniqueCorrect.includes(ev)) },
    { id: 'independent',   condition: INDEPENDENT_EVENTS.length > 0 &&
        INDEPENDENT_EVENTS.every(ev => progress.uniqueCorrect.includes(ev)) },
    { id: 'kenty',        condition: progress.correctPersonality >= 5 },
    { id: 'ethnographer', condition: progress.correctPersonality >= 10 },
    { id: 'biographer',   condition: progress.correctPersonality >= 25 },
    { id: 'sixties',      condition: progress.correctWriters >= 10 },
    { id: 'hetman',       condition: progress.correctHetmans >= 5 },
    { id: 'dissident',    condition: DISSIDENTS.size > 0 &&
    [...DISSIDENTS].every(name => progress.uniquePersonalities.includes(name)) },
    { id: 'president',    condition: PRESIDENTS.size > 0 &&
    [...PRESIDENTS].every(name => progress.uniquePersonalities.includes(name)) },
  ];

  checks.forEach(({ id, condition }) => {
    if (condition && !u[id]) {
      u[id] = true;
      newlyUnlocked.push(id);
    }
  });

  // Показуємо тост тільки для нових ачівок
  if (newlyUnlocked.length > 0) {
    const ach = ACHIEVEMENTS.find(a => a.id === newlyUnlocked[0]);
    if (ach) showToast(ach);
  }
}

    let currentIndex = 0;
    let score = 0;
    let questions = [];
    let answered = false;
    const TOTAL = 15;

    const screens = {
      menu: document.getElementById('screen-menu'),
      quiz: document.getElementById('screen-quiz'),
      result: document.getElementById('screen-result'),
      achievements: document.getElementById('screen-achievements')
    };

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function showScreen(name) {
      Object.values(screens).forEach(s => s.classList.remove('active'));
      screens[name].classList.add('active');
    }

    function getWrong(correct, key, count = 3) {
      const year = correct.year;
      let candidates = events.filter(e => e[key] !== correct[key] && Math.abs(e.year - year) <= 80);
      if (candidates.length < count) {
        candidates = events.filter(e => e[key] !== correct[key] && Math.abs(e.year - year) <= 150);
      }
      if (candidates.length < count) {
        candidates = events.filter(e => e[key] !== correct[key]);
      }
      return shuffle(candidates).slice(0, count).map(e => e[key]);
    }

    function startQuiz(selectedMode) {
      mode = selectedMode;
      currentIndex = 0;
      score = 0;
      answered = false;

      if (selectedMode === 'century20') {
        questions = shuffle(events.filter(e => e.year >= 1900 && e.year < 2000)).slice(0, TOTAL);
        mode = 'event-to-date';
      } else if (selectedMode === 'person-to-fact' || selectedMode === 'fact-to-person') {
        questions = shuffle(personalities).slice(0, Math.min(TOTAL, personalities.length));
      } else {
        questions = shuffle(events).slice(0, TOTAL);
      }

      showScreen('quiz');
      renderQuestion();
    }

    function renderQuestion() {
      answered = false;
      const item = questions[currentIndex];
      document.getElementById('progress-fill').style.width = (currentIndex / TOTAL * 100) + '%';
      document.getElementById('progress-info').textContent = `Питання ${currentIndex + 1} з ${TOTAL}`;
      document.getElementById('score-box').textContent = `✓ ${score}`;

      let question, correct, options;

      if (mode === 'event-to-date') {
        document.getElementById('question-label').textContent = 'Яка дата цієї події?';
        question = item.event;
        correct = item.date;
        options = shuffle([correct, ...getWrong(item, 'date')]);
      } else if (mode === 'date-to-event') {
        document.getElementById('question-label').textContent = 'Що сталося в цю дату?';
        question = item.date;
        correct = item.event;
        options = shuffle([correct, ...getWrong(item, 'event')]);
      } else if (mode === 'person-to-fact') {
        document.getElementById('question-label').textContent = 'Який факт стосується цієї особи?';
        const person = item;
        question = person.name;
        correct = person.facts[Math.floor(Math.random() * person.facts.length)];
        let wrongFacts = [];
        const others = personalities.filter(p => p.name !== person.name);
        while (wrongFacts.length < 3) {
          const rndPerson = others[Math.floor(Math.random() * others.length)];
          const rndFact = rndPerson.facts[Math.floor(Math.random() * rndPerson.facts.length)];
          if (!wrongFacts.includes(rndFact) && rndFact !== correct) wrongFacts.push(rndFact);
        }
        options = shuffle([correct, ...wrongFacts]);
      } else if (mode === 'fact-to-person') {
        document.getElementById('question-label').textContent = 'Кому належить цей факт?';
        const person = item;
        correct = person.name;
        question = person.facts[Math.floor(Math.random() * person.facts.length)];
        const wrongNames = shuffle(personalities.filter(p => p.name !== person.name)).slice(0, 3).map(p => p.name);
        options = shuffle([correct, ...wrongNames]);
      }

      document.getElementById('question-text').textContent = question;
      const container = document.getElementById('options');
      container.innerHTML = '';
      const letters = ['А', 'Б', 'В', 'Г'];
      options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.innerHTML = `<span class="letter">${letters[i]}</span>${opt}`;
        btn.dataset.value = opt;
        btn.onclick = () => selectAnswer(btn, correct);
        container.appendChild(btn);
      });
    }

    function selectAnswer(btn, correct) {
      if (answered) return;
      answered = true;
      const all = document.querySelectorAll('.option');
      all.forEach(o => o.classList.add('disabled'));

      if (btn.dataset.value === correct) {
        btn.classList.add('correct');
        score++;
        document.getElementById('score-box').textContent = `✓ ${score}`;
        if (mode === 'event-to-date' || mode === 'date-to-event' || mode === 'century20') {
          registerCorrect(questions[currentIndex]);
        }
        if (mode === 'person-to-fact' || mode === 'fact-to-person') {
    registerPersonalityCorrect(questions[currentIndex]);
  }
}
      else {
        btn.classList.add('wrong');
        all.forEach(o => {
          if (o.dataset.value === correct) o.classList.add('correct');
        });
      }

      setTimeout(() => {
        currentIndex++;
        if (currentIndex < TOTAL) renderQuestion();
        else showResult();
      }, 1100);
    }

    function showResult() {
      document.getElementById('progress-fill').style.width = '100%';
      const percent = Math.round(score / TOTAL * 100);
      let emoji, title;
      if (percent >= 90) { emoji = '🏆'; title = 'Відмінно!'; }
      else if (percent >= 70) { emoji = '🔥'; title = 'Дуже добре!'; }
      else if (percent >= 50) { emoji = '👍'; title = 'Непогано'; }
      else { emoji = '📚'; title = 'Треба ще потренуватися'; }

      document.getElementById('result-emoji').textContent = emoji;
      document.getElementById('result-title').textContent = title;
      document.getElementById('result-score').textContent = `${score} / ${TOTAL}`;
      document.getElementById('result-details').textContent = `Ти правильно відповів на ${percent}% питань`;

      progress.quizzesPlayed++;
      if (score === 15) progress.perfect15 = true;
      if (score === 14) progress.almost15 = true;
      checkAchievements();
      saveProgress(progress);

      showScreen('result');
    }

    // ===== CHRONOLOGY =====
    const CH_TOTAL = 10;
    const CH_MAX_SPAN = 15;
    let chOrder = [];
    let chGroup = [];

    function makeChronoGroup(usedAnchors) {
      for (const anchor of shuffle(events)) {
        if (usedAnchors.has(anchor.event)) continue;
        const byYear = new Map();
        events.forEach(e => {
          if (e.year > anchor.year && e.year <= anchor.year + CH_MAX_SPAN && !byYear.has(e.year)) {
            byYear.set(e.year, e);
          }
        });
        if (byYear.size >= 3) {
          usedAnchors.add(anchor.event);
          const others = shuffle([...byYear.values()]).slice(0, 3);
          return shuffle([anchor, ...others]);
        }
      }
      return null;
    }

    function startChrono() {
      mode = 'chronology';
      currentIndex = 0;
      score = 0;
      answered = false;
      const used = new Set();
      questions = [];
      while (questions.length < CH_TOTAL) {
        const g = makeChronoGroup(used);
        if (!g) break;
        questions.push(g);
      }
      showScreen('quiz');
      renderChrono();
    }

    function renderChrono() {
      answered = false;
      chOrder = [];
      chGroup = questions[currentIndex];
      document.getElementById('progress-fill').style.width = (currentIndex / questions.length * 100) + '%';
      document.getElementById('progress-info').textContent = `Питання ${currentIndex + 1} з ${questions.length}`;
      document.getElementById('score-box').textContent = `✓ ${score}`;
      document.getElementById('question-label').textContent = 'Хронологія: від найраніших до найпізніших';
      document.getElementById('question-text').textContent = 'Натискай на події у правильній послідовності';

      const container = document.getElementById('options');
      container.innerHTML = '';
      chGroup.forEach((ev, i) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.dataset.idx = i;
        btn.innerHTML = `<span class="letter">•</span><span class="ch-text">${ev.event}</span>`;
        btn.onclick = () => chooseChrono(btn, i);
        container.appendChild(btn);
      });

      const reset = document.createElement('button');
      reset.className = 'chrono-reset';
      reset.textContent = '↺ Скинути вибір';
      reset.onclick = () => { if (!answered) renderChrono(); };
      container.appendChild(reset);
    }

    function chooseChrono(btn, idx) {
      if (answered || chOrder.includes(idx)) return;
      chOrder.push(idx);
      btn.classList.add('chosen');
      btn.querySelector('.letter').textContent = chOrder.length;

      if (chOrder.length < chGroup.length) return;

      answered = true;
      const sorted = chGroup.map((ev, i) => ({ ev, i })).sort((a, b) => a.ev.year - b.ev.year);
      const buttons = document.querySelectorAll('#options .option');
      let allCorrect = true;

      sorted.forEach((item, correctPos) => {
        const b = buttons[item.i];
        const userPos = chOrder.indexOf(item.i);
        b.classList.remove('chosen');
        b.classList.add('disabled');
        b.classList.add(userPos === correctPos ? 'correct' : 'wrong');
        if (userPos !== correctPos) allCorrect = false;
        b.querySelector('.letter').textContent = correctPos + 1;
        b.insertAdjacentHTML('beforeend', `<span class="ch-date">${item.ev.date}</span>`);
      });

      const resetBtn = document.querySelector('.chrono-reset');
      if (resetBtn) resetBtn.style.display = 'none';

      if (allCorrect) {
        score++;
        document.getElementById('score-box').textContent = `✓ ${score}`;
        chGroup.forEach(ev => registerCorrect(ev));
      }

      setTimeout(() => {
        currentIndex++;
        if (currentIndex < questions.length) renderChrono();
        else showChronoResult();
      }, allCorrect ? 1200 : 2800);
    }

    function showChronoResult() {
      document.getElementById('progress-fill').style.width = '100%';
      const total = questions.length;
      const percent = Math.round(score / total * 100);
      let emoji, title;
      if (percent >= 90) { emoji = '🏆'; title = 'Відмінно!'; }
      else if (percent >= 70) { emoji = '🔥'; title = 'Дуже добре!'; }
      else if (percent >= 50) { emoji = '👍'; title = 'Непогано'; }
      else { emoji = '📚'; title = 'Треба ще потренуватися'; }

      document.getElementById('result-emoji').textContent = emoji;
      document.getElementById('result-title').textContent = title;
      document.getElementById('result-score').textContent = `${score} / ${total}`;
      document.getElementById('result-details').textContent = `Правильно розставлено ${percent}% послідовностей`;

      progress.quizzesPlayed++;
      checkAchievements();
      saveProgress(progress);

      showScreen('result');
    }

    // ===== HANDLERS =====
    document.getElementById('btn-chrono').onclick = startChrono;
    document.getElementById('btn-event-date').onclick = () => startQuiz('event-to-date');
    document.getElementById('btn-date-event').onclick = () => startQuiz('date-to-event');
    document.getElementById('btn-century20').onclick = () => startQuiz('century20');
    document.getElementById('btn-person-fact').onclick = () => startQuiz('person-to-fact');
    document.getElementById('btn-fact-person').onclick = () => startQuiz('fact-to-person');
    document.getElementById('btn-restart').onclick = () => startQuiz(mode);
    document.getElementById('btn-menu').onclick = () => showScreen('menu');
    document.getElementById('btn-back').onclick = () => showScreen('menu');
    document.getElementById('btn-achievements').onclick = () => {
      renderAchievements();
      showScreen('achievements');
    };
    document.getElementById('btn-back-ach').onclick = () => showScreen('menu');
  </script>
</body>
</html>
