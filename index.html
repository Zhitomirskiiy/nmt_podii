  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .container { width: 100%; max-width: 650px; }

    h1 {
      text-align: center;
      font-size: 1.9rem;
      margin: 20px 0 8px;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 30px;
      font-size: 1rem;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .mode-btn {
      width: 100%;
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 14px;
      padding: 22px 20px;
      margin-bottom: 14px;
      cursor: pointer;
      color: #e2e8f0;
      text-align: left;
      transition: 0.2s;
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .mode-btn:hover {
      border-color: #3b82f6;
      background: #243044;
      transform: translateY(-2px);
    }
    .mode-btn .icon { font-size: 2rem; }
    .mode-btn h2 { font-size: 1.15rem; margin-bottom: 4px; }
    .mode-btn p { font-size: 0.9rem; color: #94a3b8; }

    .stats {
      text-align: center;
      color: #94a3b8;
      margin-top: 20px;
      font-size: 0.95rem;
    }
    .stats span { color: #60a5fa; font-weight: 600; }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .progress-info { color: #94a3b8; }
    .score-box {
      background: #1e293b;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 600;
    }

    .progress-bar {
      height: 6px;
      background: #334155;
      border-radius: 3px;
      margin-bottom: 24px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      width: 0%;
      transition: width 0.3s;
    }

    .question-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 24px 20px;
      margin-bottom: 20px;
    }
    .question-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 10px;
    }
    .question-text {
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.45;
    }

    .option {
      width: 100%;
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 15px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      color: #e2e8f0;
      font-size: 1rem;
      text-align: left;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .option:hover:not(.disabled) {
      border-color: #3b82f6;
      background: #243044;
    }
    .option .letter {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .option.correct {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.15);
    }
    .option.correct .letter { background: #22c55e; color: #fff; }
    .option.wrong {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
    }
    .option.wrong .letter { background: #ef4444; color: #fff; }
    .option.disabled { cursor: default; opacity: 0.9; }

    .back-btn {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.95rem;
      margin-bottom: 16px;
    }
    .back-btn:hover { color: #e2e8f0; }

    .result-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 36px 24px;
      text-align: center;
    }
    .result-emoji { font-size: 3.2rem; margin-bottom: 10px; }
    .result-card h2 { font-size: 1.5rem; margin-bottom: 8px; }
    .result-score {
      font-size: 2.4rem;
      font-weight: 700;
      color: #60a5fa;
      margin: 14px 0;
    }
    .result-details { color: #94a3b8; margin-bottom: 26px; }

    .btn-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      padding: 12px 26px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-secondary {
      background: transparent;
      border: 1px solid #334155;
      color: #e2e8f0;
    }
    .btn-secondary:hover { background: #243044; }

    footer {
      margin-top: 40px;
      text-align: center;
      color: #64748b;
      font-size: 0.8rem;
    }
  </style>
</head>

    let mode = null;
    let currentIndex = 0;
    let score = 0;
    let questions = [];
    let answered = false;
    const TOTAL = 15;

    const screens = {
      menu: document.getElementById('screen-menu'),
      quiz: document.getElementById('screen-quiz'),
      result: document.getElementById('screen-result')
    };

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function showScreen(name) {
      Object.values(screens).forEach(s => s.classList.remove('active'));
      screens[name].classList.add('active');
    }

    // Беремо неправильні варіанти з того ж століття (±50–100 років)
    function getWrong(correct, key, count = 3) {
      const year = correct.year;
      // Спочатку шукаємо в межах ±80 років
      let candidates = events.filter(e => 
        e[key] !== correct[key] && 
        Math.abs(e.year - year) <= 80
      );

      // Якщо мало — розширюємо до ±150 років
      if (candidates.length < count) {
        candidates = events.filter(e => 
          e[key] !== correct[key] && 
          Math.abs(e.year - year) <= 150
        );
      }

      // Якщо все ще мало — беремо будь-які
      if (candidates.length < count) {
        candidates = events.filter(e => e[key] !== correct[key]);
      }

      return shuffle(candidates).slice(0, count).map(e => e[key]);
    }

 function startQuiz(selectedMode) {
  mode = selectedMode;
  currentIndex = 0;
  score = 0;
  answered = false;

  let pool = events;
   
  if (selectedMode === 'century20') {
    pool = events.filter(e => e.year >= 1900 && e.year < 2000);
    mode = 'event-to-date';
  }

  questions = shuffle(pool).slice(0, Math.min(TOTAL, pool.length));
  showScreen('quiz');
  renderQuestion();
}

    function renderQuestion() {
      answered = false;
      const item = questions[currentIndex];

      document.getElementById('progress-fill').style.width = (currentIndex / TOTAL * 100) + '%';
      document.getElementById('progress-info').textContent = `Питання ${currentIndex + 1} з ${TOTAL}`;
      document.getElementById('score-box').textContent = `✓ ${score}`;

      let question, correct, options;

      if (mode === 'event-to-date') {
        document.getElementById('question-label').textContent = 'Яка дата цієї події?';
        question = item.event;
        correct = item.date;
        options = shuffle([correct, ...getWrong(item, 'date')]);
      } else {
        document.getElementById('question-label').textContent = 'Що сталося в цю дату?';
        question = item.date;
        correct = item.event;
        options = shuffle([correct, ...getWrong(item, 'event')]);
      }

      document.getElementById('question-text').textContent = question;
      const container = document.getElementById('options');
      container.innerHTML = '';
      const letters = ['А', 'Б', 'В', 'Г'];

      options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.innerHTML = `<span class="letter">${letters[i]}</span>${opt}`;
        btn.dataset.value = opt;
        btn.onclick = () => selectAnswer(btn, correct);
        container.appendChild(btn);
      });
    }

    function selectAnswer(btn, correct) {
      if (answered) return;
      answered = true;

      const all = document.querySelectorAll('.option');
      all.forEach(o => o.classList.add('disabled'));

      if (btn.dataset.value === correct) {
        btn.classList.add('correct');
        score++;
        document.getElementById('score-box').textContent = `✓ ${score}`;
      } else {
        btn.classList.add('wrong');
        all.forEach(o => {
          if (o.dataset.value === correct) o.classList.add('correct');
        });
      }

      setTimeout(() => {
        currentIndex++;
        if (currentIndex < TOTAL) renderQuestion();
        else showResult();
      }, 1100);
    }

    function showResult() {
      document.getElementById('progress-fill').style.width = '100%';
      const percent = Math.round(score / TOTAL * 100);
      let emoji, title;
      if (percent >= 90) { emoji = '🏆'; title = 'Відмінно!'; }
      else if (percent >= 70) { emoji = '🔥'; title = 'Дуже добре!'; }
      else if (percent >= 50) { emoji = '👍'; title = 'Непогано'; }
      else { emoji = '📚'; title = 'Треба ще потренуватися'; }

      document.getElementById('result-emoji').textContent = emoji;
      document.getElementById('result-title').textContent = title;
      document.getElementById('result-score').textContent = `${score} / ${TOTAL}`;
      document.getElementById('result-details').textContent = `Ти правильно відповів на ${percent}% питань`;
      showScreen('result');
    }

   document.getElementById('btn-event-date').onclick = () => startQuiz('event-to-date');
    document.getElementById('btn-date-event').onclick = () => startQuiz('date-to-event');
    document.getElementById('btn-century20').onclick = () => startQuiz('century20');
    document.getElementById('btn-restart').onclick = () => startQuiz(mode);
    document.getElementById('btn-menu').onclick = () => showScreen('menu');
    document.getElementById('btn-back').onclick = () => showScreen('menu');

    document.getElementById('total-dates').textContent = events.length;
